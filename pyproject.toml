[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-engine"
version = "0.1.0"
description = "Paper-only GEM dual-momentum engine with real market data"
requires-python = ">=3.10"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
profit-engine = "profit_engine.cli:main"
signal-desk = "profit_engine.server:main"
signal-desk-live = "profit_engine.live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"profit_engine.live" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the checked-out source (not whatever checkout the venv was `pip install -e`'d from).
pythonpath = ["src"]
# Ruff is scoped to the intraday harness and the live runner for now: the older modules would need ~27 lint
# fixes and a 23-file reformat, which belongs in its own change.
[tool.ruff]
line-length = 120
target-version = "py310"
include = [
  "src/profit_engine/intraday/**/*.py",
  "tests/intraday/**/*.py",
  "src/profit_engine/live/**/*.py",
  "tests/live/**/*.py",
  "experiments/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "NPY"]
ignore = ["PLR0913", "PLR2004", "PLR0915", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.pylint]
max-args = 12
