[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-engine"
version = "0.1.0"
description = "Paper-only GEM dual-momentum engine with real market data"
requires-python = ">=3.10"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
profit-engine = "profit_engine.cli:main"
signal-desk = "profit_engine.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Scoped to the files this change touched; the older modules are not lint-clean yet.
include = [
  "src/profit_engine/paper_step.py",
  "src/profit_engine/paper_ml.py",
  "src/profit_engine/paper_ml_crypto.py",
  "tests/test_paper_step.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "NPY"]
ignore = ["PLR0913", "PLR2004", "PLR0915", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.pylint]
max-args = 12
