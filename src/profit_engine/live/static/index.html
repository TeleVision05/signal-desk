<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Desk Live</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #e3e1da;
  --accent: #2d5bd7; --good: #1f7a4a; --bad: #b3261e; --warn-bg: #fff4d6; --warn-ink: #6b4b00;
  --chip: #eef0f4; --promoted: #e3f3ea; --promoted-ink: #1f7a4a; --demo: #f3ece2; --demo-ink: #7a4d12;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418; --panel: #1b1e24; --ink: #e8e9ec; --muted: #9aa1ab; --line: #2b2f37;
    --accent: #7ea2ff; --good: #5cc98b; --bad: #ff8a80; --warn-bg: #3a2f12; --warn-ink: #f3d58a;
    --chip: #262a32; --promoted: #183526; --promoted-ink: #7fdca5; --demo: #3a2c1a; --demo-ink: #f0c48a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.paper { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 16px; text-align: center; font-weight: 600; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  max-width: 1100px; margin: 0 auto; padding: 18px 16px 6px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.beat { padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 14px; }
.beat.late { background: var(--warn-bg); color: var(--warn-ink); }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
.note { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
.books { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.title { font-weight: 650; font-size: 17px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.chip.promoted { background: var(--promoted); color: var(--promoted-ink); font-weight: 600; }
.chip.demo { background: var(--demo); color: var(--demo-ink); font-weight: 600; }
.chip.paused { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
.equity { text-align: right; }
.equity .big { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); }
.pos { margin: 10px 0 6px; font-size: 14px; }
.why { background: var(--chip); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.why small { display: block; color: var(--muted); margin-top: 4px; }
svg.chart { width: 100%; height: 140px; display: block; margin: 12px 0 4px; }
.axis { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
td, th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.scroll { overflow-x: auto; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.events { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 16px; margin-top: 16px; }
.ev { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ev:last-child { border-bottom: 0; }
.ev .when { color: var(--muted); font-size: 12px; }
.ev .kind { font-weight: 600; }
.ev.kill_switch .kind, .ev.error .kind, .ev.strategy_error .kind { color: var(--bad); }
@media (max-width: 560px) { .ev { grid-template-columns: 1fr; gap: 2px; } .equity { text-align: left; } }
</style>
</head>
<body>
<div class="paper">PAPER MONEY ONLY. These books trade fake money on real Binance prices; no real orders are ever placed.</div>
<header>
  <h1>Signal Desk Live</h1>
  <div id="beat" class="beat">Loading…</div>
</header>
<main>
  <p class="note">Runs only while this Mac is awake. After sleep it acts on the newest closed bar and skips the bars it missed.</p>
  <div id="books" class="books"></div>
  <h3>What happened</h3>
  <div id="events" class="events"><div class="empty">Nothing yet.</div></div>
</main>
<script>
const KIND = { catch_up: "Caught up after a pause", gap: "Missing data", stale_data: "Old data, skipped",
  kill_switch: "Daily loss stop", resumed: "Trading again", data_error: "Connection problem",
  bad_price: "Odd price, skipped", strategy_error: "Strategy problem", error: "Problem",
  clock_skew: "Clock check", config_error: "Settings problem" };
const money = (x) => x == null ? "—" : "$" + Number(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x) => (x >= 0 ? "+" : "") + x.toFixed(2) + "%";
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
const when = (iso) => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
let beatInfo = null;
function renderBeat() {
  const box = document.getElementById("beat");
  const r = beatInfo && beatInfo.runner;
  box.className = "beat";
  if (!r) { box.textContent = "The runner has not checked in yet."; box.classList.add("late"); return; }
  const age = (Date.now() - Date.parse(r.ts)) / 1000;
  let text = "Last checked " + ago(r.ts);
  if (r.status === "stopped") text = "Runner stopped " + ago(r.ts);
  else if (r.status === "offline") text += " (couldn't reach Binance)";
  else if (r.status === "degraded") text += " (a book had a problem, see below)";
  // Late only past the runner's own planned next check (it backs off up to 10 min while Binance is down).
  const planned = (r.detail && r.detail.next_check_s) || 30;
  const late = age > Math.max(180, planned + 120);
  if (r.status === "offline" && !late) text += "; still retrying, next try in about " + Math.max(1, Math.round((planned - age) / 60)) + " min";
  if (late && r.status !== "stopped") text += ". The Mac may be asleep or the runner is not running.";
  if (late || r.status !== "ok") box.classList.add("late");
  box.textContent = text;
}
function chart(points) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "chart"); svg.setAttribute("viewBox", "0 0 600 140"); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Equity over time");
  if (points.length < 2) return svg;
  const ys = points.map(p => p.equity), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
  const t0 = Date.parse(points[0].ts), t1 = Date.parse(points[points.length - 1].ts), tw = (t1 - t0) || 1;
  const d = points.map((p, i) => (i ? "L" : "M") + ((Date.parse(p.ts) - t0) / tw * 596 + 2).toFixed(1) + "," + (136 - (p.equity - lo) / span * 130).toFixed(1)).join(" ");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d); path.setAttribute("fill", "none"); path.setAttribute("stroke", "var(--accent)");
  path.setAttribute("stroke-width", "2"); path.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(path); return svg;
}
function position(b) {
  if (b.paused_until && Date.parse(b.paused_until) > Date.now()) return "In cash, paused by the daily loss limit until " + when(b.paused_until) + ".";
  if (b.units > 0) return "Holding " + b.units.toFixed(6) + " " + b.coin + " (" + Math.round(b.weight * 100) + "% of the book), cash " + money(b.cash) + ".";
  return "All in cash (" + money(b.cash) + ").";
}
function fillsTable(rows, coin) {
  if (!rows.length) return el("div", "empty", "No trades yet.");
  const wrap = el("div", "scroll"), t = el("table"), head = el("tr");
  ["When", "Action", "Price", "Amount", "Cost"].forEach(h => head.appendChild(el("th", null, h)));
  t.appendChild(head);
  rows.slice(0, 8).forEach(f => {
    const tr = el("tr");
    const action = f.reason === "kill_switch" ? "Sold (loss stop)" : (f.side === "buy" ? "Bought" : "Sold");
    [when(f.fill_bar_ts), action, money(f.price), Math.abs(f.units_delta).toFixed(6) + " " + coin, money(f.cost)]
      .forEach(v => tr.appendChild(el("td", null, v)));
    t.appendChild(tr);
  });
  wrap.appendChild(t); return wrap;
}
function bookCard(b, curve, fills) {
  const card = el("section", "card"), top = el("div", "top"), left = el("div");
  left.appendChild(el("div", "title", b.title));
  const chips = el("div", "chips");
  chips.appendChild(el("span", "chip", b.symbol + " · " + b.timeframe + " bars"));
  chips.appendChild(el("span", "chip " + (b.promoted ? "promoted" : "demo"), b.promoted ? "Promoted strategy" : "Demo strategy — not promoted"));
  chips.appendChild(el("span", "chip", b.strategy + " v" + b.strategy_version));
  if (!b.enabled) chips.appendChild(el("span", "chip paused", "Turned off"));
  left.appendChild(chips);
  const right = el("div", "equity");
  right.appendChild(el("div", "big", money(b.equity)));
  right.appendChild(el("div", b.return_pct >= 0 ? "up" : "down", pct(b.return_pct) + " since start (" + money(b.starting_equity) + ")"));
  top.append(left, right); card.appendChild(top);
  card.appendChild(el("div", "pos", position(b)));
  const why = el("div", "why");
  if (b.last_decision) {
    why.appendChild(document.createTextNode(b.last_decision.explanation));
    why.appendChild(el("small", null, "Decided on the bar that opened " + when(b.last_decision.bar_open_ts) + ", filled at the next bar's open (" + when(b.last_decision.fill_bar_ts) + ")."));
  } else why.textContent = "No decision yet. The book waits for its first closed " + b.timeframe + " bar.";
  card.appendChild(why);
  card.appendChild(chart(curve));
  const axis = el("div", "axis");
  axis.append(el("span", null, curve.length ? when(curve[0].ts) : ""), el("span", null, curve.length ? "Marked " + ago(curve[curve.length - 1].ts) : "No equity marks yet"));
  card.appendChild(axis);
  card.appendChild(el("h3", null, "Recent trades"));
  card.appendChild(fillsTable(fills, b.coin));
  return card;
}
function renderEvents(rows, titles) {
  const box = document.getElementById("events"); box.replaceChildren();
  if (!rows.length) { box.appendChild(el("div", "empty", "Nothing yet.")); return; }
  rows.forEach(e => {
    const row = el("div", "ev " + e.kind), meta = el("div");
    meta.append(el("div", "kind", KIND[e.kind] || "Note"), el("div", "when", when(e.ts) + (e.book_id ? " · " + (titles[e.book_id] || e.book_id) : "")));
    row.append(meta, el("div", null, e.message)); box.appendChild(row);
  });
}
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error("bad response"); return r.json(); }
async function refresh() {
  try {
    const ov = await getJSON("/api/overview");
    beatInfo = ov.heartbeat; renderBeat();
    const box = document.getElementById("books"), titles = {};
    const cards = await Promise.all(ov.books.map(async b => {
      titles[b.book_id] = b.title;
      const enc = encodeURIComponent(b.book_id);
      const [curve, fills] = await Promise.all([getJSON("/api/books/" + enc + "/equity?limit=2000"), getJSON("/api/books/" + enc + "/fills?limit=20")]);
      return bookCard(b, curve, fills);
    }));
    box.replaceChildren(...cards);
    if (!cards.length) box.appendChild(el("div", "empty", "No books yet. Start the runner (signal-desk-live run) and they will appear after its first check."));
    renderEvents(await getJSON("/api/events?limit=40"), titles);
  } catch (e) {
    const box = document.getElementById("beat");
    box.className = "beat late"; box.textContent = "Can't reach the local dashboard server. Is it still running?";
  }
}
refresh(); setInterval(refresh, 15000); setInterval(renderBeat, 1000);
</script>
</body>
</html>
