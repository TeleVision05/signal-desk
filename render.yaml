services:
  - type: web
    name: signal-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAPER_CASH
        value: "1000"
      # Shared with GitHub Action wake/sync (paper-only; rotate anytime in Render env)
      - key: CRON_SECRET
        value: signal-desk-paper-sync
      - key: ALLOW_PUBLIC_SYNC
        value: "1"
      - key: TRADE_ALERTS
        value: "1"
      - key: TRADE_ALERT_EMAIL
        value: tarun.vadapalli.1@gmail.com
      - key: PYTHONUNBUFFERED
        value: "1"
