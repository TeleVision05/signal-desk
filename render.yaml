services:
  - type: web
    name: signal-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAPER_CASH
        value: "1000"
      - key: CRON_SECRET
        value: signal-desk-paper-sync
      - key: ALLOW_PUBLIC_SYNC
        value: "1"
      - key: TRADE_ALERTS
        value: "1"
      - key: TRADE_ALERT_EMAIL
        value: tarun.vadapalli.1@gmail.com
      # Add ONE of these for email (set in Render dashboard, do not commit secrets):
      #   RESEND_API_KEY=re_...
      # or SMTP_PASS=<gmail app password> with the SMTP_* vars below
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: tarun.vadapalli.1@gmail.com
      - key: PYTHONUNBUFFERED
        value: "1"
