name: Daily paper sync (backup)

on:
  schedule:
    # 21:30 UTC weekdays — backup if the web dyno slept
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Paper sync + state
        env:
          PAPER_CASH: "1000"
        run: |
          python - <<'PY'
          from profit_engine.paper_ml import sync_ml_paper
          from profit_engine.dashboard_state import build_state
          import json
          info = sync_ml_paper(initial_cash=1000.0)
          state = build_state(include_backtest=True)
          state["paper"] = info
          print(json.dumps({"equity": info.get("equity"), "signal": info.get("signal"), "action": info.get("action")}, indent=2))
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-state
          path: |
            data/
            output/ml_paper_last.json
            output/dashboard_state.json
          if-no-files-found: warn
